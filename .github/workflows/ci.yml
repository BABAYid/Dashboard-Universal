name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Зависимости (Qt6 Core/Quick, без WebEngine)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ qt6-base-dev qt6-declarative-dev
      - name: Конфигурация (только тесты)
        run: >
          cmake -S Dashboard -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DDASHBOARD_FULL_APP=OFF -DDASHBOARD_BUILD_TESTS=ON
      - name: Сборка тестов
        run: cmake --build build --target test_canprotocol test_speedcam -j
      - name: Прогон тестов
        run: |
          ./build/test_canprotocol
          ./build/test_speedcam
